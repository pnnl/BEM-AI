variables:
  AWS_ACCESS_KEY_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [automa_ai.agents.agent_factory]
  AWS_REGION:
    type: env
    params:
      caller: [os.getenv]
      path: [automa_ai.agents.agent_factory]
  AWS_SECRET_ACCESS_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [automa_ai.agents.agent_factory]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [automa_ai.agents.agent_factory]

files:
  base_log_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  entry.path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  log_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  log_file_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname, os.path.abspath]
  path:
    type: literal
    actions: [read]
    params:
      caller: [Path(entry.path), path.read_text]
  skill_name:
    type: variable
    actions: [read]
    params:
      caller: [skill_manager.load]

networks:
  localhost:
    type: api
    actions: [GET]
    urls: [/sse]
    protocols: [http]
    ports: ["10100"]
    params:
      caller: [get_agent_mcp_server_config]
      links: [url]
